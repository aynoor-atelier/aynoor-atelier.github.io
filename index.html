<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYNOOR Atelier — Capital of Chronicles</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS Links -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animation.css">
</head>
<body>

    <!-- Atmospheric Vignette -->
    <div class="spotlight"></div>

    <!-- Main Canvas -->
    <main class="scene">
        <section class="book" id="book">
            
            <!-- Realistic 3D Leather Spine -->
            <div class="spine">
                <span class="spine-ridge"></span>
                <span class="spine-ridge"></span>
                <span class="spine-ridge"></span>
            </div>

            <!-- Page Stack (Closed state thickness) -->
            <div class="page-stack"></div>

            <!-- Inner Manuscript Page -->
            <article class="page">
                <div class="page-texture"></div>
                <div class="page-content">
                    <h2 class="welcome-title">WELCOME</h2>
                    <div class="page-line"></div>
                    <p class="archival-quote">
                        Every Chronicle begins with a single page.<br><br>
                        You are not entering a website.<br><br>
                        You are entering <strong>The Capital of Chronicles</strong>.
                    </p>
                    <button id="enterVault" class="vault-btn">ENTER THE VAULT</button>
                </div>
            </article>

            <!-- Front Leather Cover -->
            <article class="cover" id="cover">
                <div class="leather-overlay"></div>
                <div class="bevel-edge"></div>
                <div class="gold-frame"></div>
                <div class="inner-frame"></div>

                <!-- Brand Monogram -->
                <div class="brand-logo-container">
                    <img src="logo.png" class="logo" alt="AYNOOR Monogram">
                </div>

                <!-- Main Titles -->
                <div class="title-group">
                    <h1 class="brand-title">AYNOOR</h1>
                    <h2 class="brand-subtitle">ATELIER</h2>
                </div>

                <!-- Chronicle Motto -->
                <div class="motto-group">
                    <p class="chronicle">Capital of Chronicles</p>
                    <div class="gold-line"></div>
                </div>

                <!-- Custodial Philosophy -->
                <div class="custody-group">
                    <p class="custody-text">NOT ACQUISITION.</p>
                    <p class="custody-text">CUSTODIANSHIP.</p>
                </div>

                <!-- Volume & Roman Year -->
                <div class="volume-group">
                    <div class="volume-title">VOLUME I</div>
                    <div class="roman-year">MMXXVI</div>
                </div>

                <!-- Seal Trigger -->
<div class="seal-wrapper" id="sealTrigger" onclick="openArchiveBook()">
    <img src="seal.png" class="seal" alt="Royal Seal">
</div>



                <!-- Footer Callout -->
                <p class="break-text">BREAK THE ROYAL SEAL</p>
            </article>

        </section>
    </main>

    <!-- Audio Elements -->
    <audio id="sealSound" preload="auto">
        <source src="seal.mp3" type="audio/mpeg">
    </audio>
    
    <audio id="pageSound" preload="auto">
        <source src="paper.mp3" type="audio/mpeg">
    </audio>

    <script src="js/main.js"></script>
</body>
</html>
