<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYNOOR Atelier — Capital of Chronicles</title>

    <!-- Google Fonts (Cinzel & Montserrat ONLY) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS Links -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animation.css">
</head>
<body>

    <!-- Spotlight Background Effect -->
    <div class="spotlight"></div>

    <!-- Main 3D Canvas -->
    <main class="scene">
        <section class="book" id="book">
            
            <!-- Book Spine -->
            <div class="spine"></div>

            <!-- Front Cover -->
            <article class="cover">
                <!-- Decorative Borders -->
                <div class="gold-frame"></div>
                <div class="inner-frame"></div>

                <!-- Brand Monogram Logo -->
                <div class="brand-logo-container">
                    <img src="logo.png" class="logo" alt="AYNOOR Monogram">
                </div>

                <!-- Main Titles -->
                <div class="title-group">
                    <h1 class="brand-title">AYNOOR</h1>
                    <h2 class="brand-subtitle">ATELIER</h2>
                </div>

                <!-- Chronicle Motto -->
                <div class="motto-group">
                    <p class="chronicle">Capital of Chronicles</p>
                    <div class="gold-line"></div>
                </div>

                <!-- Custodial Philosophy -->
                <div class="custody-group">
                    <p class="custody-text">NOT ACQUISITION.</p>
                    <p class="custody-text">CUSTODIANSHIP.</p>
                </div>

                <!-- Volume & Roman Year -->
                <div class="volume-group">
                    <span class="volume-title">VOLUME I</span>
                    <span class="roman-year">MMXXVI</span>
                </div>

                <!-- Royal Wax Seal -->
                <div class="seal-wrapper">
                    <img src="seal.png" class="seal" id="sealTrigger" alt="Royal Seal">
                </div>

                <!-- Footer Callout -->
                <p class="break-text">BREAK THE ROYAL SEAL</p>
            </article>

            <!-- Inner Welcome Page -->
            <article class="page">
                <div class="page-content">
                    <h2 class="welcome-title">WELCOME</h2>
                    <div class="page-line"></div>
                    <p class="archival-quote">
                        Every Chronicle begins with a single page.<br><br>
                        You are not entering a website.<br>
                        You are entering a living archive.
                    </p>
                    <button id="enterVault" class="vault-btn">ENTER THE VAULT</button>
                </div>
            </article>

        </section>
    </main>

    <!-- Audio Elements -->
    <audio id="sealSound" preload="auto">
        <source src="seal.mp3" type="audio/mpeg">
    </audio>
    <audio id="pageSound" preload="auto">
        <source src="seal.mp3" type="audio/mpeg">
    </audio>

    <!-- JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
